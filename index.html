<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Sécurité : le code ne peut joindre QUE ces domaines. Une clé API ne peut donc pas fuir ailleurs, même en cas de faille. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.anthropic.com https://api.openai.com https://api.linear.app https://api.github.com https://api.spotify.com https://accounts.spotify.com https://api.figma.com https://*.app.n8n.cloud https://ntfy.sh wss://ntfy.sh http://localhost:* http://127.0.0.1:*; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src https://embed.figma.com">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio</title>
<meta name="description" content="Des notes Markdown reliées entre elles, stockées uniquement dans ton navigateur. Sans compte, hors ligne.">
<meta name="theme-color" content="#f2f2f3">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script src="js/boot.js"></script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <nav id="sidebar" aria-label="Navigation"></nav>
  <section id="list" aria-label="Liste des notes"></section>
  <main id="main"></main>
</div>
<div id="scrim"></div>
<div id="layer"></div>
<div id="toasts" aria-live="polite"></div>
<input type="file" id="file" hidden multiple accept=".md,.markdown,.txt,.json,.carnet">
<noscript><p style="padding:2rem;font-family:system-ui">Studio a besoin de JavaScript pour fonctionner.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
